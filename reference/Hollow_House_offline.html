<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Midnight at Hollow House</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grenze+Gotisch:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf1dc; --text: #2a1840; --muted: #6b5b7e; --card: #fffaf0; --line: #d9c9ae;
  --accent: #a84a08; --accent-ink: #ffffff; --good: #3f7a2a; --bad: #b42318; --panel: #fff6e3;
  --roomfill: #efe3c8; --roomvisit: #f6c28f; --roomnow: #e8711a; --roof: #5b3a6e; --ground: #8b6f47;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1029; --text: #f5e9d2; --muted: #c4b3d8; --card: #2a1a3d; --line: #4a3563;
    --accent: #ff8a2a; --accent-ink: #1c1029; --good: #8fd16a; --bad: #ff8f80; --panel: #33214a;
    --roomfill: #3b2955; --roomvisit: #7a4a2a; --roomnow: #ff8a2a; --roof: #a07cc5; --ground: #8b6f47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1029; --text: #f5e9d2; --muted: #c4b3d8; --card: #2a1a3d; --line: #4a3563;
  --accent: #ff8a2a; --accent-ink: #1c1029; --good: #8fd16a; --bad: #ff8f80; --panel: #33214a;
  --roomfill: #3b2955; --roomvisit: #7a4a2a; --roomnow: #ff8a2a; --roof: #a07cc5; --ground: #8b6f47;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Andika', 'Trebuchet MS', 'Segoe UI', sans-serif; font-size: 1.15rem; line-height: 1.55; }
main { max-width: 680px; margin: 0 auto; padding: 18px 18px 40px; }
.title { font-family: 'Grenze Gotisch', 'Georgia', serif; font-weight: 800; font-size: clamp(2.2rem, 7vw, 3.2rem); line-height: 1.05; margin: 6px 0 4px; letter-spacing: .5px; }
.room-title { font-family: 'Grenze Gotisch', 'Georgia', serif; font-weight: 800; font-size: clamp(1.9rem, 6vw, 2.5rem); margin: 4px 0 2px; }
.sub { color: var(--muted); font-size: 1rem; margin: 0 0 10px; }
.house { margin: 0 auto 6px; max-width: 360px; }
.house svg { width: 100%; height: auto; display: block; }
.house .roof { fill: var(--roof); }
.house .tower { fill: var(--roomfill); stroke: var(--roof); stroke-width: 2; }
.house .rooms rect { fill: var(--roomfill); stroke: var(--roof); stroke-width: 2; transition: fill .3s; }
.house .rooms rect.visited { fill: var(--roomvisit); }
.house .rooms rect.now { fill: var(--roomnow); }
.house .ground { stroke: var(--ground); stroke-width: 3; }
.house .labels text { font-size: 11px; text-anchor: middle; fill: var(--text); font-family: 'Andika', sans-serif; }
.house .labels text.now { fill: #1c1029; font-weight: 700; }
.art { background: #fffaf0; border: 2px solid var(--line); border-radius: 14px; padding: 10px; margin: 12px 0; }
.art svg { width: 100%; height: auto; display: block; }
.art.small { max-width: 240px; margin-left: auto; margin-right: auto; }
.story p { margin: 0 0 10px; }
.lock { background: var(--panel); border: 3px solid var(--text); border-radius: 18px 18px 14px 14px; padding: 14px 16px 16px; margin: 16px 0; position: relative; }
.lock::before { content: ""; position: absolute; top: -26px; left: 50%; width: 46px; height: 30px; margin-left: -23px;
  border: 6px solid var(--text); border-bottom: none; border-radius: 26px 26px 0 0; transition: transform .45s ease; transform-origin: 85% 100%; }
.lock.open::before { transform: rotate(28deg) translate(6px, -8px); border-color: var(--good); }
.lock.open { border-color: var(--good); }
.q { font-weight: 700; margin: 6px 0 6px; }
.field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.field input { width: 6.5ch; font: inherit; font-size: 1.6rem; font-weight: 700; text-align: center; padding: 6px 4px;
  border: 3px solid var(--text); border-radius: 10px; background: var(--card); color: var(--text); }
.field input:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
.field .unit { color: var(--muted); }
.coord { font-size: 1.8rem; font-weight: 700; }
.btn { font: inherit; font-weight: 700; font-size: 1.15rem; border: 0; border-radius: 12px; padding: 12px 20px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); }
.btn:focus-visible, .door:focus-visible, .ghost:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.ghost { font: inherit; font-size: 1rem; border: 2px solid var(--line); background: transparent; color: var(--text); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.msg { min-height: 1.6em; margin-top: 8px; font-weight: 700; }
.msg.bad { color: var(--bad); }
.msg.good { color: var(--good); }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-9px); } 40%,80% { transform: translateX(9px); } }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 12px; }
.door { font: inherit; font-weight: 700; font-size: 1.1rem; color: var(--text); background: var(--card); cursor: pointer;
  border: 3px solid var(--text); border-radius: 60px 60px 10px 10px; padding: 34px 16px 18px; position: relative; min-height: 120px; }
.door::after { content: ""; position: absolute; right: 18px; top: 58%; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.door:hover { background: var(--panel); }
.after { margin-top: 14px; }
.ending-emoji { font-size: 4rem; line-height: 1; margin: 6px 0; }
.kind { font-weight: 700; color: var(--accent); }
.report { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 1rem; }
.report th, .report td { text-align: left; padding: 8px 6px; border-bottom: 2px solid var(--line); }
.cupboard { background: var(--panel); border: 3px dashed var(--bad); border-radius: 14px; padding: 14px; margin-top: 10px; font-weight: 700; }
.toolbar { display: flex; gap: 10px; justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } .lock::before { transition: none; } }
</style>
</head>

\"/><rect x=\"203\" y=\"38\" width=\"12\" height=\"34\" rx=\"2\" fill=\"#fff3d6\" stroke=\"#2a1840\" stroke-width=\"1.2\"/><path d=\"M209 24 q6 8 0 13 q-6 -5 0 -13\" fill=\"#fbbf24\" stroke=\"#b45309\" stroke-width=\"1\"/><rect x=\"227\" y=\"38\" width=\"12\" height=\"34\" rx=\"2\" fill=\"#fff3d6\" stroke=\"#2a1840\" stroke-width=\"1.2\"/><path d=\"M233 24 q6 8 0 13 q-6 -5 0 -13\" fill=\"#fbbf24\" stroke=\"#b45309\" stroke-width=\"1\"/><text x=\"209\" y=\"96\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#e8711a\">47</text><text x=\"209\" y=\"113\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2a1840\">right wall</text><rect x=\"314\" y=\"38\" width=\"12\" height=\"34\" rx=\"2\" fill=\"#fff3d6\" stroke=\"#2a1840\" stroke-width=\"1.2\"/><path d=\"M320 24 q6 8 0 13 q-6 -5 0 -13\" fill=\"#fbbf24\" stroke=\"#b45309\" stroke-width=\"1\"/><rect x=\"338\" y=\"38\" width=\"12\" height=\"34\" rx=\"2\" fill=\"#fff3d6\" stroke=\"#2a1840\" stroke-width=\"1.2\"/><path d=\"M344 24 q6 8 0 13 q-6 -5 0 -13\" fill=\"#fbbf24\" stroke=\"#b45309\" stroke-width=\"1\"/><rect x=\"362\" y=\"38\" width=\"12\" height=\"34\" rx=\"2\" fill=\"#fff3d6\" stroke=\"#2a1840\" stroke-width=\"1.2\"/><path d=\"M368 24 q6 8 0 13 q-6 -5 0 -13\" fill=\"#fbbf24\" stroke=\"#b45309\" stroke-width=\"1\"/><text x=\"344\" y=\"96\" text-anchor=\"middle\" font-size=\"20\" font-weight=\"700\" fill=\"#e8711a\">85</text><text x=\"344\" y=\"113\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2a1840\">old tomb</text></svg>"}}, "endings": {"A": {"title": "The Clock Stops", "kind": "Best ending", "emoji": "🏆", "text": "Since you opened every lock before midnight, Gus is amazed. “You are the smartest kid in Hollow House!” he says. He gives back all 70 pieces of candy. Then he floats to school with you for the Halloween party."}, "B": {"title": "The Midnight Ball", "kind": "Good ending", "emoji": "🍬", "text": "You dance with the skeletons all night. Gus laughs and laughs, so he lets you go home. He gives you half of the candy: 35 pieces! Can you find the best ending?"}, "C": {"title": "The Buried Chest", "kind": "Funny ending", "emoji": "🕷", "text": "You dig at the point and find Gus’s chest. You open it. Creak! It is full of rubber spiders! The real candy is not here. The garden gate is open, so you run home safely. Where is the real candy?"}, "D": {"title": "Trapped!", "kind": "Trapped ending", "emoji": "🎃", "text": "The trapdoor slams shut above you. “You opened my lock,” says Gus, “but you walked into my pumpkin spell!” POOF! You are a pumpkin until next Halloween. Play again and choose a different path."}}, "intro": "Oh no! The class Halloween candy is gone! A trail of candy wrappers leads up the hill to Hollow House. You go inside. BANG! The door slams shut. A ghost floats down the stairs. “I am Gus,” he says. “I took your candy. Every door in my house has a number lock.” Then Gus warns you: “If you cannot open the locks before midnight, you will stay here forever!”"};
const LOCKOUT_SECONDS = 15;
let state;

function reset() {
  state = { room: null, visited: [], log: {}, wrongStreak: 0 };
}
function esc(s) { return s; }

const LABELS = {1: '🚪 Hall', 2: '🦇 Attic', 3: '🕷 Cellar', 4: '🦉 Library', 5: '⏰', 6: '💀 Ballroom', 7: '🐈 Kitchen', 8: '🌙', 9: '🕯 Crypt'};
function markHouse() {
  document.querySelectorAll('.house rect[data-r]').forEach(r => {
    const n = +r.dataset.r;
    r.classList.toggle('now', n === state.room);
    r.classList.toggle('visited', state.visited.includes(n) && n !== state.room);
  });
  document.querySelectorAll('.house text[data-l]').forEach(t => {
    const n = +t.dataset.l;
    t.textContent = state.visited.includes(n) ? LABELS[n] : '?';
    t.classList.toggle('now', n === state.room);
  });
}

function intro() {
  reset(); markHouse();
  const s = document.getElementById('screen');
  s.innerHTML = `<h1 class="title">Midnight at Hollow House</h1>
    <p class="sub">A Halloween math adventure</p>
    <div class="story"><p>${DATA.intro}</p></div>
    <p>Solve each lock to open the next door. Type your answers. When you have to choose a door, pick the one you like best. Every path ends in a different way!</p>
    <button class="btn" id="start" type="button">Enter Hollow House</button>`;
  document.getElementById('start').onclick = () => goRoom(1);
  speakText = () => DATA.intro;
}

function goRoom(n) {
  state.room = n; state.wrongStreak = 0;
  if (!state.visited.includes(n)) state.visited.push(n);
  state.log[n] = state.log[n] || { tries: 0, solved: false };
  markHouse();
  const r = DATA.rooms[n];
  const fields = r.asks.map((a, i) => {
    if (a.kind === 'coord') {
      return `<p class="q">${a.q}</p><div class="field"><span class="coord">(</span>
        <input id="a0" inputmode="numeric" autocomplete="off" aria-label="across number">
        <span class="coord">,</span>
        <input id="a1" inputmode="numeric" autocomplete="off" aria-label="up number">
        <span class="coord">)</span><span class="unit">across, then up</span></div>`;
    }
    return `<p class="q">${a.q}</p><div class="field"><input id="a${i}" inputmode="numeric" autocomplete="off" aria-label="answer">
      <span class="unit">${a.unit}</span></div>`;
  }).join('');
  const small = n === 5 ? ' small' : '';
  document.getElementById('screen').innerHTML = `
    <p class="sub">Step ${state.visited.length} of 4</p>
    <h2 class="room-title">${r.title}</h2>
    <div class="story">${r.text.map(t => `<p>${t}</p>`).join('')}</div>
    <div class="art${small}">${r.art}</div>
    <div class="lock" id="lock">${fields}
      <button class="btn" id="try" type="button">Try the lock</button>
      <div class="msg" id="msg" role="status"></div></div>
    <div id="next"></div>`;
  document.getElementById('try').onclick = () => tryLock(n);
  document.querySelectorAll('#lock input').forEach(inp => {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryLock(n); });
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^0-9]/g, '').slice(0, 4); });
  });
  const first = document.getElementById('a0'); if (first) first.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
  speakText = () => [r.title, ...r.text, ...r.asks.map(a => a.q)].join('. ');
}

function tryLock(n) {
  const r = DATA.rooms[n];
  const inputs = [...document.querySelectorAll('#lock input')];
  const vals = inputs.map(i => i.value.trim());
  const msg = document.getElementById('msg');
  if (vals.some(v => v === '')) { msg.className = 'msg bad'; msg.textContent = 'Type a number in every box first.'; return; }
  state.log[n].tries += 1;
  const ok = vals.every((v, i) => parseInt(v, 10) === r.answers[i]);
  const lock = document.getElementById('lock');
  if (ok) {
    state.log[n].solved = true;
    lock.classList.add('open');
    inputs.forEach(i => i.disabled = true);
    document.getElementById('try').remove();
    msg.className = 'msg good'; msg.textContent = 'Click! The lock opens.';
    showNext(n);
    return;
  }
  state.wrongStreak += 1;
  lock.classList.remove('shake'); void lock.offsetWidth; lock.classList.add('shake');
  msg.className = 'msg bad';
  if (state.wrongStreak >= 3) {
    lockout(inputs);
  } else {
    msg.textContent = 'The lock won’t open. Check your work and try again.';
  }
}

function lockout(inputs) {
  const btn = document.getElementById('try');
  const msg = document.getElementById('msg');
  inputs.forEach(i => i.disabled = true); btn.disabled = true;
  let left = LOCKOUT_SECONDS;
  msg.innerHTML = `<div class="cupboard">Gus locks you in the cupboard! Out in <span id="cd">${left}</span> seconds…</div>`;
  const t = setInterval(() => {
    left -= 1;
    const cd = document.getElementById('cd'); if (cd) cd.textContent = left;
    if (left <= 0) {
      clearInterval(t); state.wrongStreak = 0;
      inputs.forEach(i => { i.disabled = false; i.value = ''; }); btn.disabled = false;
      msg.className = 'msg'; msg.textContent = 'You’re out! Check your work and try the lock again.';
      inputs[0].focus();
    }
  }, 1000);
}

function showNext(n) {
  const r = DATA.rooms[n];
  const nx = document.getElementById('next');
  if (r.ending) {
    nx.innerHTML = `<button class="btn" id="go" type="button">Go through the door</button>`;
    document.getElementById('go').onclick = () => ending(r.ending);
  } else if (r.choices.length === 1) {
    nx.innerHTML = `<p class="after">${r.after}</p><button class="btn" id="go" type="button">${r.choices[0].label}</button>`;
    document.getElementById('go').onclick = () => goRoom(r.choices[0].to);
  } else {
    nx.innerHTML = `<p class="after">${r.after}</p><p class="q">Which door will you open?</p>
      <div class="doors">${r.choices.map((c, i) => `<button class="door" data-to="${c.to}" type="button">${c.label}</button>`).join('')}</div>`;
    nx.querySelectorAll('.door').forEach(d => d.onclick = () => goRoom(+d.dataset.to));
  }
  nx.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
  speakText = () => r.after || 'The lock opens.';
}

function ending(k) {
  const e = DATA.endings[k];
  state.room = null; markHouse();
  const rows = state.visited.map(n => {
    const L = state.log[n];
    const res = L.tries === 1 ? 'First try ✓' : `${L.tries} tries`;
    return `<tr><td>Room ${n}: ${DATA.rooms[n].title}</td><td>${DATA.rooms[n].skill}</td><td>${res}</td></tr>`;
  }).join('');
  document.getElementById('screen').innerHTML = `
    <div class="ending-emoji" aria-hidden="true">${e.emoji}</div>
    <p class="kind">${e.kind}</p>
    <h2 class="room-title">${e.title}</h2>
    <div class="story"><p>${e.text}</p></div>
    <h3>Your mission report</h3>
    <table class="report"><thead><tr><th>Room</th><th>Math</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="sub">Show this report to your teacher.</p>
    <button class="btn" id="again" type="button">Play again and try a new path</button>`;
  document.getElementById('again').onclick = intro;
  window.scrollTo({ top: 0 });
  speakText = () => [e.title, e.text].join('. ');
}

let speakText = () => '';
document.getElementById('speak').onclick = () => {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speakText().replace(/[“”]/g, ''));
  u.rate = 0.9; u.lang = 'en-GB';
  window.speechSynthesis.speak(u);
};
intro();
</script>
