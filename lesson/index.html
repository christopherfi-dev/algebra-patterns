<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seeing the Rule</title>
<style>
/* The two lesson colours. --constant is only ever the constant; --coefficient is only ever a group of the coefficient.
   Okabe–Ito-style orange and blue: distinct under protan, deutan and tritan simulation, and at least 4.5:1 against the page in both modes.
   Everything else on the page is neutral ink and grey, so neither colour is reused. */
:root {
  --constant: #b45309;
  --coefficient: #1d6fb8;
  --paper: #f6f5f1; --card: #ffffff; --ink: #1d2025; --muted: #5b616b; --line: #d8d5cc; --soft: #ecebe5;
  --stick-dim: #c4c0b6; --sq-a: #e2ded5; --sq-b: #a7a092; --lit: #1d2025;
  --fs: 1;   /* figure scale */
  color-scheme: light;
}
@media (min-width: 700px) { :root { --fs: 1.4; } }
@media (prefers-color-scheme: dark) {
  :root {
    --constant: #f59e4b;
    --coefficient: #6cb6f5;
    --paper: #121418; --card: #1b1e24; --ink: #ecebe6; --muted: #a3a8b1; --line: #363b46; --soft: #22262d;
    --stick-dim: #4b515c; --sq-a: #3a3f49; --sq-b: #6b7381; --lit: #ecebe6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* top bar and progress */
.top { position: sticky; top: 0; z-index: 20; background: var(--paper); }
.top-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); }
.brand { font-weight: 750; color: var(--ink); letter-spacing: .01em; }
.bar { height: 4px; background: var(--soft); }
.bar > span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s ease; }

main { max-width: 760px; margin: 0 auto; padding: 22px 16px 150px; }
.eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1.title { font-size: clamp(25px, 5.6vw, 32px); line-height: 1.2; margin: 0 0 16px; letter-spacing: -.01em; }
h1.title:focus { outline: none; }
.intro { margin: 0 0 12px; }
.formula { font-size: 22px; font-weight: 700; text-align: center; margin: 2px 0; font-variant-numeric: tabular-nums; }
.reminder { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-weight: 600; margin: 0 0 12px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 6px 0 4px; }
.figs { display: flex; flex-wrap: wrap; gap: 16px 18px; align-items: flex-end; justify-content: center; }
figure { margin: 0; text-align: center; min-width: 0; max-width: 100%; }
figure svg { display: block; margin: 0 auto; max-width: 100%; height: auto; overflow: visible; }
figcaption { font-size: 15px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.count { font-weight: 750; color: var(--ink); }
.students { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; margin: 4px 0; }
.student { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.student .name { font-weight: 750; }
.student .r { font-size: 20px; font-weight: 650; white-space: nowrap; }

/* steps */
.step { margin-top: 24px; scroll-margin: 90px 0 130px; }
.path .step { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--line); }
.prompt { font-weight: 650; margin: 0 0 10px; }
.line { margin: 0 0 10px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
.prefix, .unit { font-weight: 650; white-space: nowrap; }
.ans { font-size: 22px; font-weight: 650; min-height: 52px; width: 6.5em; max-width: 100%; min-width: 0; padding: 8px 12px;
  border: 2px solid var(--muted); border-radius: 12px; background: var(--card); font-variant-numeric: tabular-nums; }
.ans.rule { width: 11em; }
.ans.small { width: 4.2em; text-align: center; }
.ans:focus { outline: 3px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
.ans:disabled { opacity: 1; border-style: dashed; background: transparent; }
.fields { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.fieldbox { display: grid; gap: 4px; justify-items: center; }
.fieldbox .lab { font-size: 15px; font-weight: 650; color: var(--muted); }
.fieldbox.left { justify-items: start; }
.fieldbox.left figure, .fieldbox.left figcaption { text-align: left; }
.fieldbox.left figure svg { margin: 0; }
.gridtable { border-collapse: collapse; }
.gridtable th, .gridtable td { padding: 4px 3px; text-align: center; font-weight: 650; }
.gridtable th[scope="row"] { text-align: left; padding-right: 8px; }
.gridtable .ans.small { width: 3em; }
@media (min-width: 520px) { .gridtable th[scope="row"] { white-space: nowrap; } .gridtable .ans.small { width: 4em; } .gridtable td { padding: 4px 6px; } }
.okmark { width: 30px; height: 30px; flex: 0 0 auto; }
.btn { min-height: 48px; min-width: 48px; padding: 10px 20px; border-radius: 12px; border: 2px solid var(--ink);
  background: var(--ink); color: var(--paper); font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .choice:focus-visible, .piece:focus-visible, .mark:focus-visible, .drop:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* feedback */
.fb { margin-top: 12px; }
.fb:empty { display: none; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 2px dashed var(--line); }
.note[data-kind="correct"] { border: 2px solid var(--ink); }
.note[data-kind="format"] { border-style: solid; }
.note svg.icon { flex: 0 0 auto; width: 26px; height: 26px; margin-top: 1px; }
.note-body { min-width: 0; overflow-wrap: anywhere; }
.note-body p { margin: 0; }
.note-body p + p { margin-top: 6px; }
.test { font-variant-numeric: tabular-nums; font-weight: 650; }
.demo:empty, .path:empty { display: none; }
.demo { margin-top: 12px; }
.answer-card { padding: 12px 14px; border-radius: 14px; background: var(--soft); }
.answer-card .label { display: block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.answer-card .val { font-size: 21px; font-weight: 750; overflow-wrap: anywhere; }
.answer-card p { margin: 6px 0 0; }

/* choices and marks */
.choices { display: grid; gap: 10px; margin-bottom: 12px; }
.choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; min-height: 52px; padding: 12px 14px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--card); cursor: pointer; line-height: 1.4; }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 650; }
.choice.is-answer { border-style: dashed; border-color: var(--ink); }
.choice:disabled { cursor: default; }
.choice .okmark { width: 26px; height: 26px; }
.mark-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mark-row .who { font-weight: 650; }
.mark-btns { display: flex; gap: 8px; }
.mark { min-height: 46px; min-width: 46px; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 650; cursor: pointer; }
.mark[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.mark.is-answer { outline: 2px dashed var(--ink); outline-offset: 2px; }

/* explain */
textarea.explain { display: block; width: 100%; min-height: 120px; font-size: 18px; padding: 10px 12px; border: 2px solid var(--muted); border-radius: 12px; background: var(--card); resize: vertical; }
textarea.explain:focus { outline: 3px solid var(--ink); outline-offset: 1px; }
.compare { display: grid; gap: 12px; margin-bottom: 10px; }
@media (min-width: 640px) { .compare.two { grid-template-columns: 1fr 1fr; } }
.model { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin: 0; font-weight: 600; }
label.tick { display: inline-flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; cursor: pointer; }
label.tick input { width: 26px; height: 26px; accent-color: var(--ink); margin: 0; }

/* Why? */
.why-wrap { margin-top: 26px; }
.why { margin-top: 12px; background: var(--soft); border-radius: 16px; padding: 14px 16px; }
.why p { margin: 0 0 10px; }
.why p:last-child { margin-bottom: 0; }
.why .card { margin: 8px 0 12px; }

/* tables */
.tablewrap { max-width: 100%; overflow-x: auto; }
table.t { border-collapse: collapse; margin: 6px 0 10px; font-size: 16px; font-variant-numeric: tabular-nums; }
.t th, .t td { border: 1px solid var(--line); padding: 6px 9px; text-align: center; min-width: 2.4em; background: var(--card); }
.t th[scope="row"] { text-align: left; font-weight: 650; background: var(--soft); min-width: 0; }
.why .t th[scope="row"] { background: var(--card); }
.t td.filled { animation: rowIn .5s ease both; }
.t tr.enter { animation: rowIn .5s ease both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* colour words and swatches */
.math { white-space: nowrap; }
.formula, .readout, .student .r, figcaption { white-space: nowrap; }
.first { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; line-height: 1.15; }
.first .fv { font-weight: 750; }
.first .fl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.c { color: var(--constant); font-weight: 750; }
.k { color: var(--coefficient); font-weight: 750; }
.sw { display: inline-block; width: .95em; height: .95em; border-radius: 3px; vertical-align: -.12em; margin: 0 .1em; }
.sw.c { background: var(--constant); }
.sw.k { background: var(--coefficient); }

/* figures */
.t-const { fill: var(--constant); }
.t-coef { fill: var(--coefficient); }
.g-const { fill: var(--constant); fill-opacity: .14; }
.g-coef { fill: var(--coefficient); fill-opacity: .14; }
.slot { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
line.slot { stroke-width: 2.5; stroke-linecap: round; }
.stick { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.stick.const { stroke: var(--constant); }
.stick.coef { stroke: var(--coefficient); }
.stick.dim { stroke: var(--stick-dim); }
.stick.lit { stroke: var(--lit); }
.stick.flash { animation: flash .45s ease-in-out 6 alternate; }
@keyframes flash { to { opacity: .1; } }
.hit { fill: transparent; cursor: pointer; outline: none; }
.hit:focus-visible { fill: var(--soft); stroke: var(--ink); stroke-width: 2; }
.armed .hit { fill: var(--ink); fill-opacity: .06; }
.ring.ra rect { fill: var(--sq-a); }
.ring.rb rect { fill: var(--sq-b); }
.ringline { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.ring.lit rect { fill: var(--lit); transition: fill .4s; }
.counter { font-size: 40px; font-weight: 800; text-align: center; min-height: 1.3em; margin: 4px 0; font-variant-numeric: tabular-nums; }
.readout { text-align: center; font-weight: 650; font-size: 20px; margin: 8px 0 0; min-height: 1.5em; font-variant-numeric: tabular-nums; }
.bordrow { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; align-items: flex-end; margin-top: 10px; }
.chip { display: grid; justify-items: center; gap: 2px; }
.chip b { font-size: 20px; font-variant-numeric: tabular-nums; }
.graph .axis { stroke: var(--muted); stroke-width: 1.5; }
.graph .grid { stroke: var(--line); stroke-width: 1; }
.graph text { fill: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.graph text.pl { fill: var(--ink); font-weight: 700; }
.graph .pt { fill: var(--ink); }
.graph .ring { fill: none; stroke: var(--ink); stroke-width: 2.5; }
.graph .fit { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.graph .rise { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 5 4; }
.graph text.rl { fill: var(--ink); font-weight: 700; }
.graph text.rl, .graph text.pl { paint-order: stroke; stroke: var(--card); stroke-width: 4px; stroke-linejoin: round; }
.ramp .wedge { fill: var(--soft); stroke: var(--muted); stroke-width: 1.5; }
.ramp .ball { fill: var(--ink); }
.ramp .tick { stroke: var(--muted); stroke-width: 1.5; }
.ramp text { fill: var(--muted); font-size: 13px; }
.shrink .sq { fill: var(--sq-a); stroke: var(--card); stroke-width: 2; }
.shrink .strip { fill: var(--sq-b); }
.shrink .corner { fill: var(--lit); }
.shrink .lead { stroke: var(--muted); stroke-width: 1; }
.shrink text { fill: var(--ink); font-size: 14px; font-weight: 650; }
.dials { display: grid; gap: 4px 16px; grid-template-columns: auto 1fr auto; align-items: center; margin-top: 10px; }
.dials label { font-weight: 750; font-size: 20px; font-style: italic; }
.dials output { font-weight: 750; font-size: 20px; min-width: 2.2em; text-align: right; font-variant-numeric: tabular-nums; }

/* sliders */
input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 48px; margin: 6px 0 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; margin-top: -13px; border-radius: 50%; background: var(--ink); border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); border: 3px solid var(--paper); }
input[type="range"]:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
input[type="range"]:disabled { opacity: .5; cursor: default; }

/* drag and tap */
.tray { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; padding: 12px; margin-top: 12px;
  border: 2px dashed var(--line); border-radius: 16px; min-height: 80px; }
.tray .aside { font-weight: 650; }
.piece { touch-action: none; -webkit-user-select: none; user-select: none; background: var(--card); border: 2px solid var(--line);
  border-radius: 14px; padding: 8px 10px; min-width: 56px; min-height: 56px; cursor: grab; display: inline-flex; align-items: center; justify-content: center; }
.piece svg { display: block; pointer-events: none; }
.piece[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
.piece:disabled { opacity: .3; cursor: default; }
.ghost-piece { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; opacity: .92; margin: 0; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.drop { display: block; border-radius: 14px; touch-action: manipulation; }
.drop.armed { outline: 3px dashed var(--ink); outline-offset: 4px; cursor: pointer; }
.drop.over { outline: 3px solid var(--ink); outline-offset: 4px; }
.buildarea { min-height: 120px; display: flex; align-items: center; justify-content: center; }
.frozen .interactive { pointer-events: none; }

/* exit ticket and self-check */
.items { counter-reset: item; display: grid; gap: 22px; margin-top: 8px; }
.item .q { font-weight: 650; margin: 0 0 8px; }
.item .q .num { display: inline-block; min-width: 1.6em; font-weight: 800; }
.item .fb { margin-top: 10px; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.checklist li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.checklist li span { display: block; }
.checklist li span::first-letter { text-transform: uppercase; }
.checklist svg { flex: 0 0 auto; width: 28px; height: 28px; }

/* bottom navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); }
.nav-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 12px; }
.nav .btn { min-width: 112px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner"><span class="brand" id="brand"></span><span id="where"></span></div>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
</header>
<main id="lesson"></main>
<nav class="nav" aria-label="Lesson navigation">
  <div class="nav-inner">
    <button class="btn ghost" id="back" type="button"></button>
    <button class="btn" id="next" type="button"></button>
  </div>
</nav>
<script>
'use strict';

/* =====================================================================
   MODEL. Every count, border, speed and table value on screen comes from these functions.
   ===================================================================== */
const range = (a, b) => (b < a ? [] : Array.from({ length: b - a + 1 }, (_, i) => a + i));

// Tiles (Screens 2 to 6): 2 fixed tiles plus n groups of 3.
const TILES = { fixed: 2, group: 3 };
const tileCount = n => TILES.fixed + TILES.group * n;

// Sticks (Screens 7 to 10): a straight row of n squares, neighbours sharing an edge.
// Edges: uprights v0…vn, tops t0…, bottoms b0…, listed in counting order. Figure 0 is the lone stick v0.
function stickEdges(n) {
  const e = ['v0'];
  for (let i = 0; i < n; i++) e.push(`t${i}`, `b${i}`, `v${i + 1}`);
  return e;
}
const stickCount = n => stickEdges(n).length;
const sharedEdges = n => range(1, n - 1).map(i => `v${i}`);
function completeSquares(edges) {
  let k = 0;
  while ([`v${k}`, `t${k}`, `b${k}`, `v${k + 1}`].every(e => edges.includes(e))) k++;
  return k;
}
// Building a student's rule (Screen 10): constant sticks fill the first square in this order;
// each group of 3 then adds a top, a bottom and a right side.
const CONST_ORDER = ['v0', 't0', 'b0', 'v1'];
function builtEdges(constant, groups) {
  const out = CONST_ORDER.slice(0, constant).map(e => ({ e, cls: 'const' }));
  const start = constant >= CONST_ORDER.length ? 1 : 0;
  for (let i = 0; i < groups; i++) {
    const k = start + i;
    out.push({ e: `t${k}`, cls: 'coef' }, { e: `b${k}`, cls: 'coef' }, { e: `v${k + 1}`, cls: 'coef' });
  }
  return out;
}

// Squares (Screens 11 to 13): ring j is the L-shaped border that turns (j − 1) × (j − 1) into j × j.
function ringCells(j) {
  const out = [];
  for (let r = 0; r < j; r++) for (let c = 0; c < j; c++) if (Math.max(r, c) === j - 1) out.push([r, c]);
  return out;
}
const borderTiles = j => ringCells(j).length;
const squareTiles = k => range(1, k).reduce((a, j) => a + borderTiles(j), 0);

// The ball (Screens 13 and 14): d = t² metres after t seconds.
const dist = t => t * t;
const avgSpeed = (t, h) => (dist(t + h) - dist(t)) / h;
// The shrinking border (Screen 14): a 3 × 3 square, two strips 3 × h and a corner h × h.
const SHRINK = { side: 3, t: 3, table: [1, 0.5, 0.1, 0.01] };
const stripsPerH = () => 2 * SHRINK.side;   // what the average speed closes in on as the corner vanishes

/* =====================================================================
   LESSON DATA. All learner-facing content lives here; the engine below reads it.
   Quoted text comes word for word from docs/Seeing-the-Rule-Interactive-Lesson-Plan.md.
   Prompts marked "spec: Learner types…" turn a spec step description into a question; REPORT.md lists every one.
   Tokens: {c|text} and {k|text} colour text as constant / coefficient; {sw:c} and {sw:k} are colour swatches.
   ===================================================================== */
const LESSON = {
  title: 'Seeing the Rule',
  ui: {
    check: 'Check',
    why: 'Why?',
    next: 'Next',
    back: 'Back',
    submit: 'Submit',
    progress: (i, n) => `Screen ${i} of ${n}`,
    ruleFormat: 'Type a rule using n, such as 2n + 5.',   // from HANDOFF.md
    edgeTaken: 'That edge is already there.',
    firstSquare: 'first square',   // Round-2-Wording E: Nina's 4
    cantDoIt: "I can't do it",
    // Not in the spec; listed in REPORT.md for Marc to replace.
    numberFormat: 'Type a number.',
    fallback: 'Not yet. Try again.',
    answer: 'Answer',
    compare: 'Compare',
    same: 'Mine says the same thing.',
    tiles: n => `${n} tiles`,
  },
  parts: {
    2: 'Part 2: Tiles. See the structure',
    3: 'Part 3: Sticks. Two ways to see one rule',
    4: 'Part 4: Evaluate and repair',
    5: 'Part 5: When the growth grows',
    6: 'Part 6: From squares to speed',
    7: 'Part 7: Exit ticket',
  },
  screens: [
    /* ---------------- Screen 2 ---------------- */
    {
      n: 2, part: 2, title: 'What stays and what grows?',
      show: [{ tiles: [1, 2, 3] }],
      steps: [
        { id: 'A', type: 'number', prompt: 'How many tiles of the first colour {sw:c} are in every figure?',
          answer: () => TILES.fixed,
          say: 'The same 2 tiles, in every figure.',
          wrong: [{ values: [5], say: '5 is all of Figure 1. Count only the colour that stays the same size.' }] },
        { id: 'B', type: 'number', prompt: 'How many tiles does each new figure add?',

const TEST_POINTS = [0, 1, 2, 3, 7, 1.5];

function normalize(raw) {
  return String(raw)
    .replace(/[−‒–—﹣－]/g, '-')
    .replace(/[×✕✖·•∙⋅]/g, '*')
    .replace(/÷/g, '/')
    .trim();
}

// Screen 13: a ball rolling down a ramp, d = t².
function rampFigure([t0, t1]) {
  const A = { x: 24, y: 34 }, B = { x: 336, y: 150 }, R = 10;
  const len = Math.hypot(B.x - A.x, B.y - A.y), ux = (B.x - A.x) / len, uy = (B.y - A.y) / len, nx = uy, ny = -ux;

  const svg = s('svg', { viewBox: '0 0 360 190', class: 'ramp', role: 'img', 'aria-label': 'A ball on a ramp', style: 'width: 100%; max-width: 520px' });
  add(svg, s('polygon', { points: `${A.x},${A.y} ${B.x},${B.y} ${A.x},${B.y}`, class: 'wedge' }));
  range(t0, t1).forEach(t => {
    const p = at(dist(t));
    // The first label sits to the left of the start so it doesn't collide with the next one.
    const label = t === t0 ? { x: p.x - 10, y: p.y + 4, 'text-anchor': 'end' } : { x: p.x - nx * 18, y: p.y - ny * 18 + 4, 'text-anchor': 'middle' };

}

// Screen 14: the 3 × 3 square with two strips 3 × h and a corner h × h.

    Object.entries({ x: x0, y: top, width: w, height: side * U }).forEach(([k, v]) => rightStrip.setAttribute(k, v));
    Object.entries({ x: x0, y: top - w, width: w, height: w }).forEach(([k, v]) => corner.setAttribute(k, v));

/* =====================================================================
   DRAG, WITH TAP-THEN-TAP AS THE ALTERNATIVE
   ===================================================================== */
let picked = null;
function unpick() {
  if (!picked) return;
  picked.piece.setAttribute('aria-pressed', 'false');
  picked.opts.targets().forEach(t => t.classList.remove('armed'));
  picked = null;
}
function pick(piece, opts) {
  unpick();
  picked = { piece, opts };
  piece.setAttribute('aria-pressed', 'true');
  opts.targets().forEach(t => t.classList.add('armed'));
}
// opts: hit(x, y) -> target or null; place(target, piece); targets() -> elements that accept a tap; hoverEl(target)
function draggable(piece, opts) {
  let justDragged = false;
  piece.setAttribute('aria-pressed', 'false');
  piece.addEventListener('pointerdown', e => {
    if (piece.disabled || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const sx = e.clientX, sy = e.clientY;
    let ghost = null, over = null;
    justDragged = false;
    try { piece.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
    const move = ev => {
      if (!ghost) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        unpick();
        const r = piece.getBoundingClientRect();
        ghost = piece.cloneNode(true);
        ghost.classList.add('ghost-piece');
        ghost.style.width = r.width + 'px';
        ghost.style.height = r.height + 'px';
        ghost.dataset.w = r.width; ghost.dataset.h = r.height;
        add(document.body, ghost);
        justDragged = true;
      }
      ghost.style.transform = `translate(${ev.clientX - ghost.dataset.w / 2}px, ${ev.clientY - ghost.dataset.h / 2}px)`;
      const t = opts.hit(ev.clientX, ev.clientY);
      const el = t == null || !opts.hoverEl ? null : opts.hoverEl(t);
      if (over && over !== el) over.classList.remove('over');
      over = el;
      if (over) over.classList.add('over');
    };
    const end = ev => {
      piece.removeEventListener('pointermove', move);
      piece.removeEventListener('pointerup', end);
      piece.removeEventListener('pointercancel', end);
      if (over) over.classList.remove('over');
      if (!ghost) return;
      ghost.remove();
      if (ev.type === 'pointerup') {
        const t = opts.hit(ev.clientX, ev.clientY);
        if (t != null) opts.place(t, piece);
      }

    piece.addEventListener('pointermove', move);
    piece.addEventListener('pointerup', end);
    piece.addEventListener('pointercancel', end);

/* =====================================================================

function promptEl(st) { return st.prompt ? h('p', { class: 'prompt', id: newId('p') }, rich(st.prompt)) : null; }

function inputField(st, kind, label) {
  const inp = h('input', { class: 'ans' + (kind === 'rule' ? ' rule' : '') + (st.small ? ' small' : ''), type: 'text',
    inputmode: kind === 'rule' ? 'text' : 'decimal', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false',
    'aria-label': label || st.label || (st.prompt ? plain(st.prompt) : 'answer'), 'data-input': '' });

// The Check flow shared by every typed or chosen answer.
function askStep(st, c, ui) {
  const fb = h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
  const demo = h('div', { class: 'demo' });
  const pathEl = h('div', { class: 'path' });
  const check = h('button', { type: 'button', class: 'btn check' }, LESSON.ui.check);
  add(ui.row, check);
  append(c.el, [ui.el, fb, demo, pathEl]);
  let misses = 0, finished = false;
  const submit = () => {
    if (finished) return;
    const vals = ui.values();
    if (vals.some(v => v === '' || v == null)) { ui.focusEmpty(); return; }
    const res = st.judge && st.type !== 'numbers' ? st.judge(vals, st, c) : JUDGE[st.type](st, vals, c);
    const parts = [
      ...(res.pre || []).map(t => ({ cls: 'test', text: t })),
      ...(res.say ? [{ cls: 'say', text: res.say }] : []),
      ...(res.post || []).map(t => (typeof t === 'string' ? { cls: 'test', text: t } : t)),
    ];
    fb.replaceChildren(parts.length ? note(res.kind, parts) : '');
    if (res.kind === 'format' || res.kind === 'partial') { ui.again(); return; }
    if (res.act) res.act(c);
    if (res.kind === 'correct') {
      finished = true;
      ui.lock();
      check.remove();
      if (!parts.length) ui.markOk();
      demo.querySelectorAll('[data-default-answer]').forEach(el => el.remove());   // the confirmation now says the same
      if (st.onCorrect) st.onCorrect(c);
      if (c.last) c.revealWhy();
      c.done();
      return;
    }
    misses += 1;
    if (res.path) {
      finished = true;
      ui.lock();
      check.remove();
      if (c.last) c.hideWhy();
      runSteps(res.path, c, pathEl, () => { if (c.last) c.revealWhy(); c.done(); }, true);
      return;
    }
    if (c.last && res.kind === 'wrong') c.revealWhy();
    if (misses === 2) secondMiss(st, c, demo, ui);
    ui.again();

  ui.onEnter(submit);
}

function answerText(st) {
  if (st.answerText) return st.answerText();
  if (st.type === 'rule') return `${st.prefix ? st.prefix + ' ' : ''}${st.answer}`;
  if (st.type === 'number') return `${st.prefix ? st.prefix + ' ' : ''}${fmt(st.answer())}${st.unit ? ' ' + st.unit : ''}`;
  if (st.type === 'choice') return plain(st.options.find(o => o.correct).text);
  if (st.type === 'marks') return st.items.map(it => `${it.who}: ${it.correct ? st.labels[0] : st.labels[1]}`).join(', ');
  if (st.type === 'numbers') {
    const a = st.answers().map(fmt);
    if (st.grid) return st.grid.rows.map((r, i) => `${r}: ${a.slice(i * st.grid.cols.length, (i + 1) * st.grid.cols.length).join(', ')}`).join('; ');
    return st.fields.map((f, i) => `${f.label}: ${a[i]}`).join(', ');

// Second miss: the answer, with the step's explanation, and on a screen's last step the Why? text opens too.

      again: () => {},
      onEnter: () => {},
      markOk: () => add(row, okMark()),
      showAnswer: () => groups.forEach((g, i) => g.btns.forEach((b, j) => b.classList.toggle('is-answer', (j === 0) === st.items[i].correct))),
    });
  },

  // Screen 2: drag one group of 3 onto Figure 3 to build Figure 4.
  placeGroup(st, c) {
    add(c.el, promptEl(st));
    const caption = `Figure ${st.from + 1}`;
    const target = h('div', { class: 'drop interactive', role: 'button', tabindex: '0', 'aria-label': caption }, fig(tilesSVG(st.from, { slot: true }), caption));
    const piece = h('button', { type: 'button', class: 'piece', 'aria-label': `group of ${TILES.group}` }, groupPieceSVG());
    const tray = h('div', { class: 'tray interactive' }, piece);
    const opts = {
      targets: () => [target],
      hit: (x, y) => (inside(target, x, y, 24) ? 'slot' : null),
      hoverEl: () => target,
      place: () => {
        target.replaceChildren(fig(tilesSVG(st.from + 1), caption));
        ['role', 'tabindex', 'aria-label'].forEach(a => target.removeAttribute(a));
        target.classList.remove('drop');
        tray.remove();
        c.done();
      },
    };
    draggable(piece, opts);
    tapTarget(target, 'slot', opts);
    add(c.el, h('div', { class: 'card' }, h('div', { class: 'figs' }, target)), tray);
  },

  // A figure with a slider for n; done when the learner reaches the target figure.
  slide(st, c) {
    add(c.el, promptEl(st));
    const holder = h('div', { class: 'figs' });
    const readout = h('p', { class: 'readout', hidden: true });
    const input = h('input', { type: 'range', min: st.min, max: st.max, step: 1, value: st.start, class: 'interactive', 'aria-label': 'Figure number', 'data-slider': '' });
    let rule = null, done = false;
    const render = () => {
      const n = +input.value;
      const svg = st.figure === 'tiles' ? tilesSVG(n, { width: st.max }) : sticksSVG(n, { width: st.max, colour: st.colour, scale: 0.7 });
      holder.replaceChildren(fig(svg, `Figure ${n}`));
      input.setAttribute('aria-valuetext', `Figure ${n}`);
      if (rule) readout.replaceChildren(...rich(rule(n)));
    };
    input.addEventListener('input', () => {
      render();
      if (!done && +input.value === st.target) { done = true; c.done(); }
    });
    c.s.slider = {
      set: n => { input.value = n; render(); },
      showRule: fn => { rule = fn; readout.hidden = false; render(); },
    };
    render();
    add(c.el, h('div', { class: 'card' }, holder, readout, input));
  },

  // Screen 7: drag sticks onto the edges of Figure 4. A stick dropped on an existing edge is rejected.
  buildSticks(st, c) {
    add(c.el, promptEl(st));
    const n = st.from + 1, all = stickEdges(n), present = new Set(stickEdges(st.from));
    const scale = 1.68, thick = 44 / scale + 2, len = SIDE - 2 * INSET;
    const svg = sticksSVG(n, { scale, edges: [] });
    svg.setAttribute('aria-label', `Figure ${n}`);
    const lines = {}, hits = {};
    for (const e of all) {
      const g = edgeLine(e);
      lines[e] = s('line', { ...g, class: present.has(e) ? 'stick' : 'slot', 'data-edge': e });
      const v = e[0] === 'v', cx = (g.x1 + g.x2) / 2, cy = (g.y1 + g.y2) / 2;
      hits[e] = s('rect', { class: 'hit', x: v ? cx - thick / 2 : cx - len / 2, y: v ? cy - len / 2 : cy - thick / 2, width: v ? thick : len, height: v ? len : thick,
        role: 'button', tabindex: '0', 'aria-label': edgeName(e), 'data-hit': e });
    }
    all.forEach(e => add(svg, lines[e]));
    all.forEach(e => add(svg, hits[e]));
    const target = h('div', { class: 'drop interactive' }, fig(svg, `Figure ${n}`));
    const piece = h('button', { type: 'button', class: 'piece', 'aria-label': 'stick' }, stickPieceSVG(''));
    const tray = h('div', { class: 'tray interactive' }, piece);
    const fb = h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
    const opts = {
      targets: () => [target],
      hit: (x, y) => {
        if (!inside(target, x, y, 10)) return null;
        const p = toSVG(svg, x, y);
        let best = null, bestD = Infinity;
        for (const e of all) {
          const g = edgeLine(e), d = Math.hypot(p.x - (g.x1 + g.x2) / 2, p.y - (g.y1 + g.y2) / 2);
          if (d < bestD) { bestD = d; best = e; }
        }
        return bestD < SIDE * 0.6 ? best : null;
      },
      hoverEl: () => target,
      place: e => {
        if (present.has(e)) {
          fb.replaceChildren(note('wrong', [{ cls: 'say', text: LESSON.ui.edgeTaken }]));
          lines[e].classList.remove('flash'); void lines[e].getBBox(); lines[e].classList.add('flash');
          return;
        }
        present.add(e);
        lines[e].setAttribute('class', 'stick');
        fb.replaceChildren();
        if (all.every(x => present.has(x))) {
          tray.remove();
          Object.values(hits).forEach(r => r.remove());
          target.classList.remove('drop');
          c.done();
        }
      },
    };
    draggable(piece, opts);
    for (const e of all) tapTarget(hits[e], e, opts);
    add(c.el, h('div', { class: 'card' }, h('div', { class: 'figs' }, target)), tray, fb);
  },

  // Screen 7, Marc's move: the sticks light up one by one, then the shared edges flash.
  async countSticks(st, c) {
    const svg = sticksSVG(st.n, { dim: true, scale: 1.3 });
    const counter = h('p', { class: 'counter', 'aria-live': 'polite' });
    add(c.el, h('div', { class: 'card' }, h('div', { class: 'figs' }, fig(svg, `Figure ${st.n}`)), counter));
    const edges = stickEdges(st.n);
    await wait(500);
    for (let i = 0; i < edges.length; i++) {
      svg.querySelector(`[data-edge="${edges[i]}"]`).setAttribute('class', 'stick lit');
      counter.textContent = fmt(i + 1);
      await wait(450);
    }
    for (const t of st.after || []) add(c.el, h('p', { class: 'line' }, rich(t)));
    sharedEdges(st.n).forEach(e => svg.querySelector(`[data-edge="${e}"]`).classList.add('flash'));
    await wait(2700);
    c.done();
  },

  // Screen 10: build a student's rule for Figure 1 from constant sticks and groups of 3.
  buildRule(st, c) {
    add(c.el, promptEl(st), h('p', { class: 'formula' }, rich(st.atOne)));
    let nc = 0, ng = 0;
    const area = h('div', { class: 'drop buildarea interactive', role: 'button', tabindex: '0', 'aria-label': `${st.who}'s build` });
    const draw = () => {
      const edges = builtEdges(nc, ng);
      area.replaceChildren(fig(sticksSVG(2, { width: 2, scale: 1.3, edges })));
    };
    const stick = h('button', { type: 'button', class: 'piece', 'aria-label': 'stick in the first colour', 'data-piece': 'stick' }, stickPieceSVG('const'));
    const group = h('button', { type: 'button', class: 'piece', 'aria-label': 'group of 3 in the second colour', 'data-piece': 'group' }, groupStickSVG());
    const tray = h('div', { class: 'tray interactive' }, stick, group, st.groupsNote ? h('span', { class: 'aside' }, st.groupsNote) : null);
    const fb = h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
    const update = () => {
      stick.disabled = nc >= st.constant;
      group.disabled = ng >= st.groups;
      if (nc >= st.constant && ng >= st.groups) {
        unpick();
        tray.remove();
        ['role', 'tabindex', 'aria-label'].forEach(a => area.removeAttribute(a));
        area.classList.remove('drop');
        if (st.result) fb.replaceChildren(note('correct', [{ cls: 'say', text: st.result }]));
        c.done();
      }
    };
    const opts = {
      targets: () => [area],
      hit: (x, y) => (inside(area, x, y, 24) ? 'area' : null),
      hoverEl: () => area,
      place: (t, piece) => {
        if (piece === stick && nc < st.constant) nc++;
        else if (piece === group && ng < st.groups) ng++;
        draw();
        update();
      },
    };
    draggable(stick, opts);
    draggable(group, opts);
    tapTarget(area, 'area', opts);
    draw();
    add(c.el, h('div', { class: 'card' }, area), tray, fb);
    update();
  },

  // Screen 10, step E: not scored.
  explain(st, c) {
    add(c.el, promptEl(st));
    const ta = h('textarea', { class: 'explain', 'aria-label': plain(st.prompt) });
    const btn = h('button', { type: 'button', class: 'btn' }, LESSON.ui.compare);
    btn.disabled = true;
    ta.addEventListener('input', () => { btn.disabled = !ta.value.trim(); });
    const cmp = h('div', { class: 'compare' }, ta);
    const row = h('div', { class: 'row' }, btn);
    btn.addEventListener('click', () => {
      ta.readOnly = true;
      row.remove();
      cmp.classList.add('two');
      add(cmp, h('p', { class: 'model' }, rich(st.model)));
      add(c.el, h('label', { class: 'tick' }, h('input', { type: 'checkbox' }), LESSON.ui.same));
      c.revealWhy();
      c.done();
    });
    add(c.el, cmp, row);
    focusSoon(ta);
  },

  // Screen 11: drag the L-shaped border that turns each square into the next.
  growSquare(st, c) {
    add(c.el, promptEl(st));
    let k = st.from;
    const area = h('div', { class: 'drop interactive', role: 'button', tabindex: '0', 'aria-label': 'square' });
    const row = h('div', { class: 'bordrow' });
    const piece = h('button', { type: 'button', class: 'piece', 'aria-label': 'L-shaped border' });
    const tray = h('div', { class: 'tray interactive' }, piece);
    const draw = () => {
      area.replaceChildren(fig(squareSVG(k, { width: st.to, ghost: k < st.to ? k + 1 : 0, scale: 1.4 }), `Figure ${k}`));
      piece.replaceChildren(ringPieceSVG(k + 1));
    };
    const opts = {
      targets: () => [area],
      hit: (x, y) => (inside(area, x, y, 24) ? 'area' : null),
      hoverEl: () => area,
      place: () => {
        k += 1;
        add(row, h('div', { class: 'chip' }, ringPieceSVG(k), h('b', {}, fmt(borderTiles(k)))));
        draw();
        if (k >= st.to) {
          tray.remove();
          ['role', 'tabindex', 'aria-label'].forEach(a => area.removeAttribute(a));
          area.classList.remove('drop');
          c.done();
        }
      },
    };
    draggable(piece, opts);
    tapTarget(area, 'area', opts);
    draw();
    add(c.el, h('div', { class: 'card' }, h('div', { class: 'figs' }, area), row), tray);
  },

  // Screen 12: dials for a and b. After three tries, or "I can't do it", the border row reappears.
  dials(st, c) {
    const g = graphFigure(st.points);
    const formula = h('p', { class: 'formula' });
    let a = st.a.start, b = st.b.start, tries = 0, over = false;
    const dial = (name, cfg, setv) => {
      const out = h('output', {});
      const inp = h('input', { type: 'range', min: cfg.min, max: cfg.max, step: 1, value: cfg.start, 'aria-label': name, 'data-dial': name });
      inp.addEventListener('input', () => { setv(+inp.value); out.textContent = fmt(+inp.value); update(); });
      out.textContent = fmt(cfg.start);
      return [h('label', {}, name), inp, out];
    };
    const update = () => {
      g.set(a, b);
      formula.textContent = ruleText(a, b);
    };
    const check = h('button', { type: 'button', class: 'btn check' }, LESSON.ui.check);
    const cant = h('button', { type: 'button', class: 'btn ghost', 'data-cant': '' }, LESSON.ui.cantDoIt);
    const rowEl = h('div', { class: 'row' }, check, cant);
    const reveal = h('div', {});
    const finish = () => {
      if (over) return;
      over = true;
      rowEl.remove();
      g.showRises();
      add(reveal, borderRow(st.points.slice(1).map(n => n)));
      c.revealWhy();
      c.done();
    };
    check.addEventListener('click', () => { g.hits(); tries += 1; if (tries >= st.tries) finish(); });
    cant.addEventListener('click', finish);
    add(c.el, h('div', { class: 'card' }, h('div', { class: 'figs' }, fig(g.svg)), formula, reveal,
      h('div', { class: 'dials' }, dial('a', st.a, v => { a = v; }), dial('b', st.b, v => { b = v; }))), h('div', { style: 'margin-top: 12px' }, rowEl));
    update();
  },

  // Screen 14: slide h toward 0; the table fills as h shrinks.
  shrinkSlide(st, c) {
    add(c.el, promptEl(st));
    const sh = c.s.shrink, STEPS_PER_DECADE = 100, max = 2 * STEPS_PER_DECADE;
    const toH = p => { const v = 10 ** (-p / STEPS_PER_DECADE); const nice = sh.table.find(x => Math.abs(x - v) / x < 0.02); return nice ?? v; };
    const start = Math.round(-Math.log10(0.5) * STEPS_PER_DECADE);
    const input = h('input', { type: 'range', min: 0, max, step: 1, value: start, class: 'interactive', 'aria-label': 'h', 'data-slider': '' });
    let done = false;
    input.addEventListener('input', () => {
      const hv = toH(+input.value);
      sh.set(hv);
      input.setAttribute('aria-valuetext', `h = ${fmt(Math.round(hv * 1000) / 1000)}`);
      sh.table.forEach(x => { if (hv <= x + 1e-12 && x < 0.5) sh.fill(x); });
      if (!done && +input.value === max) { done = true; c.done(); }
    });
    add(c.el, h('div', { class: 'card' }, input));
  },

  // Screen 15: typed answers only; no hints and no Why? until the learner submits.
  exit(st, c) {
    const items = st.items.map((it, i) => {
      const fbEl = h('div', { class: 'fb', role: 'status', 'aria-live': 'polite' });
      const q = h('p', { class: 'q' }, h('span', { class: 'num' }, `${i + 1}.`), rich(it.q));
      let read, lock, mark, input = null;
      if (it.type === 'choice') {
        let chosen = null;
        const btns = it.options.map((o, j) => h('button', { type: 'button', class: 'choice', 'aria-pressed': 'false', 'data-choice': j,
          onclick: () => { chosen = j; btns.forEach((b, k) => b.setAttribute('aria-pressed', String(k === j))); } },
          h('span', {}, rich(o.text || range(1, 4).map(n => fmt(o.seq(n))).join(', ')))));
        read = () => chosen;
        lock = () => btns.forEach(b => { b.disabled = true; });
        mark = ok => { if (ok) add(btns[chosen], okMark()); else btns.forEach((b, j) => b.classList.toggle('is-answer', !!it.options[j].correct)); };
        return { it, fbEl, read, lock, mark, el: h('div', { class: 'item', 'data-item': i + 1 }, q, h('div', { class: 'choices', role: 'group' }, btns), fbEl) };
      }
      const f = inputField({ prefix: it.prefix, label: it.q }, it.type);
      input = f.inp;
      const row = h('div', { class: 'row' }, f.el);
      read = () => input.value.trim();
      lock = () => { input.disabled = true; };
      mark = ok => { if (ok) add(row, okMark()); };
      return { it, fbEl, read, lock, mark, input, el: h('div', { class: 'item', 'data-item': i + 1 }, q, row, fbEl) };
    });
    const submit = h('button', { type: 'button', class: 'btn', 'data-submit': '' }, LESSON.ui.submit);
    const grade = x => {
      const { it } = x, v = x.read();
      if (it.type === 'choice') return it.options[v].correct ? { ok: true } : { ok: false, say: it.options[v].ifChosen || it.ifWrong };
      if (it.type === 'number') return near(parseNumber(v), it.answer()) ? { ok: true } : { ok: false, say: it.ifWrong };
      const e = parseRule(v);
      const ok = isLinear(e) && sameRule(e, parseRule(it.answer)) && (!it.mustUse || usesBracket(e, it.mustUse));
      return ok ? { ok: true } : { ok: false, say: it.ifWrong };
    };
    submit.addEventListener('click', () => {
      const empty = items.find(x => x.read() === '' || x.read() === null);
      if (empty) { (empty.input || empty.el.querySelector('button')).focus(); return; }
      // Unreadable answers are flagged without submitting; they don't count against the learner.
      let unreadable = false;
      items.forEach(x => {
        x.fbEl.replaceChildren();
        if (x.it.type === 'rule' && !parseRule(x.read())) { unreadable = true; add(x.fbEl, note('format', [{ cls: 'say', text: LESSON.ui.ruleFormat }])); }
        if (x.it.type === 'number' && parseNumber(x.read()) === null) { unreadable = true; add(x.fbEl, note('format', [{ cls: 'say', text: LESSON.ui.numberFormat }])); }
      });
      if (unreadable) return;
      items.forEach(x => {
        const g = grade(x);
        x.lock();
        x.mark(g.ok);
        if (!g.ok) add(x.fbEl, note('wrong', [{ cls: 'say', text: g.say }]));
      });
      submit.remove();
      c.log.exit = items.map(x => grade(x).ok);
      c.done();
    });
    add(c.el, h('div', { class: 'items' }, items.map(x => x.el)), h('div', { class: 'row', style: 'margin-top: 20px' }, submit));
  },

  // Screen 16: ticked by what the learner actually did.
  selfcheck(st, c) {
    const ticked = it => {
      const log = state.log[LESSON.screens.findIndex(sc => sc.n === it.screen)];
      return !!(log && log.done && !log.secondMiss);
    };
    add(c.el, h('ul', { class: 'checklist' }, st.items.map(it => {
      const on = ticked(it);
      const ic = icon(on ? 'correct' : 'empty');
      ic.removeAttribute('aria-hidden');
      ic.setAttribute('role', 'img');
      ic.setAttribute('aria-label', on ? 'ticked' : 'not ticked');
      return h('li', { 'data-ticked': String(on) }, ic, h('span', {}, rich(it.text)));
    })));
    c.done();
  },
};

/* =====================================================================
   ENGINE
   ===================================================================== */
const state = { at: -1, view: -1, sections: [], log: [], booting: true };
const $ = id => document.getElementById(id);
const main = $('lesson');

// Runs steps one after another: each appears only when the one before it is done.
function runSteps(steps, ctx, container, onDone, isPath) {
  let k = 0;
  const next = () => {
    if (k >= steps.length) { onDone(); return; }
    const st = steps[k];
    const last = !isPath && k === steps.length - 1;
    k += 1;
    const el = h('div', { class: 'step', 'data-step': `${ctx.sc.n}${st.id}` });
    add(container, el);
    const c = { ...ctx, el, last, done: next };
    (st.lines || []).forEach(t => add(el, h('p', { class: 'line' }, rich(t))));
    (st.show || []).forEach(b => add(el, block(b, c)));
    STEPS[st.type](st, c);
    if (!state.booting && !(k === 1 && !isPath)) requestAnimationFrame(() => el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'nearest' }));
  };
  next();
}

function renderScreen(i) {
  const sc = LESSON.screens[i];
  const log = state.log[i] = { secondMiss: false, done: false };
  const titleId = newId('t');
  const sec = h('section', { class: 'screen', 'data-screen': sc.n, 'aria-labelledby': titleId });
  const panelId = newId('why');
  const whyBtn = h('button', { type: 'button', class: 'btn ghost why-btn', 'aria-expanded': 'false', 'aria-controls': panelId, hidden: true }, LESSON.ui.why);
  const whyPanel = h('div', { class: 'why', id: panelId, hidden: true });
  const setWhy = open => { whyPanel.hidden = !open; whyBtn.setAttribute('aria-expanded', String(open)); };
  whyBtn.addEventListener('click', () => setWhy(whyPanel.hidden));
  const ctx = {
    sc, sec, log, i, s: {},
    revealWhy: () => { if (sc.why) whyBtn.hidden = false; },
    hideWhy: () => { whyBtn.hidden = true; setWhy(false); },
    openWhy: () => { if (sc.why) { whyBtn.hidden = false; setWhy(true); } },
  };
  add(sec, h('p', { class: 'eyebrow' }, LESSON.parts[sc.part]), h('h1', { class: 'title', id: titleId, tabindex: '-1' }, sc.title));
  (sc.intro || []).forEach(t => add(sec, h('p', { class: 'intro' }, rich(t))));
  (sc.show || []).forEach(b => add(sec, block(b, ctx)));
  const steps = h('div', { class: 'steps' });
  append(whyPanel, (sc.why || []).map(b => block(b, ctx)));
  add(sec, steps, h('div', { class: 'why-wrap' }, whyBtn, whyPanel));
  add(main, sec);
  runSteps(sc.steps, ctx, steps, () => { log.done = true; chrome(); });
  return sec;
}

function freeze(sec) {
  unpick();
  sec.classList.add('frozen');
  sec.querySelectorAll('input, button, textarea').forEach(el => { if (!el.classList.contains('why-btn')) el.disabled = true; });
  sec.querySelectorAll('[tabindex]').forEach(el => { if (el.tagName !== 'H1') el.setAttribute('tabindex', '-1'); });
}

function show(i) {
  unpick();
  state.view = i;
  state.sections.forEach((el, j) => { el.hidden = j !== i; });
  chrome();
  window.scrollTo(0, 0);
  if (!state.booting) state.sections[i].querySelector('h1').focus({ preventScroll: true });
}

function forward() {
  if (state.view < state.at) { show(state.view + 1); return; }
  if (state.at >= 0 && !state.log[state.at].done) return;
  if (state.at === LESSON.screens.length - 1) return;
  if (state.at >= 0) freeze(state.sections[state.at]);
  state.at += 1;
  state.sections.push(renderScreen(state.at));
  show(state.at);
}

function chrome() {
  const total = LESSON.screens.length, i = state.view;
  $('where').textContent = LESSON.ui.progress(i + 1, total);
  $('bar').style.width = `${((i + 1) / total) * 100}%`;
  $('back').disabled = i <= 0;
  $('next').disabled = !(i < state.at || (state.log[i] && state.log[i].done && i < total - 1));
  $('next').hidden = i === total - 1;
}

$('brand').textContent = LESSON.title;
$('back').textContent = LESSON.ui.back;
$('next').textContent = LESSON.ui.next;
$('back').addEventListener('click', () => { if (state.view > 0) show(state.view - 1); });
$('next').addEventListener('click', forward);
forward();
state.booting = false;
</script>
</body>
</html>
