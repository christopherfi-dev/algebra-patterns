<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growing Patterns: Finding the Rule</title>
<style>
/* The two lesson colours. --constant is only ever the constant; --coefficient is only ever a group of the coefficient.
   Okabe–Ito-style orange and blue: distinct under protan, deutan and tritan simulation, and at least 4.5:1 against the page in both modes.
   Everything else on the page is neutral ink and grey, so neither colour is reused. */
:root {
  --constant: #b45309;
  --coefficient: #1d6fb8;
  --paper: #f6f5f1; --card: #ffffff; --ink: #1d2025; --muted: #5b616b; --line: #d8d5cc; --soft: #ecebe5;
  --stick-dim: #c4c0b6; --lit: #1d2025;
  --fs: 1;   /* figure scale */
  color-scheme: light;
}
@media (min-width: 700px) { :root { --fs: 1.4; } }
@media (prefers-color-scheme: dark) {
  :root {
    --constant: #f59e4b;
    --coefficient: #6cb6f5;
    --paper: #121418; --card: #1b1e24; --ink: #ecebe6; --muted: #a3a8b1; --line: #363b46; --soft: #22262d;
    --stick-dim: #4b515c; --lit: #ecebe6;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* top bar and progress */
.top { position: sticky; top: 0; z-index: 20; background: var(--paper); }
.top-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; color: var(--muted); }
.brand { font-weight: 750; color: var(--ink); letter-spacing: .01em; }
/* Round 5: on narrow phones the progress text gets its own line under the title, so the title always fits on one line. */
@media (max-width: 419px) {
  .top-inner { flex-direction: column; align-items: flex-start; gap: 2px; }
  .brand { white-space: nowrap; }
}
.bar { height: 4px; background: var(--soft); }
.bar > span { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s ease; }

main { max-width: 760px; margin: 0 auto; padding: 22px 16px 150px; }
.eyebrow { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1.title { font-size: clamp(25px, 5.6vw, 32px); line-height: 1.2; margin: 0 0 16px; letter-spacing: -.01em; }
h1.title:focus { outline: none; }
.intro { margin: 0 0 12px; }
.formula { font-size: 22px; font-weight: 700; text-align: center; margin: 2px 0; font-variant-numeric: tabular-nums; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 6px 0 4px; }
.figs { display: flex; flex-wrap: wrap; gap: 16px 18px; align-items: flex-end; justify-content: center; }
/* Round 6: Figures 1 to 4 above the skip-count table are a little smaller on narrow phones, so they take two rows, not three. */
@media (max-width: 419px) { .figs.compact { --fs: .85; } .figs.compact.sticks { --fs: .7; } }   /* round 7: sticks at the slider's 70% */
figure { margin: 0; text-align: center; min-width: 0; max-width: 100%; }
figure svg { display: block; margin: 0 auto; max-width: 100%; height: auto; overflow: visible; }
figcaption { font-size: 15px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.count { font-weight: 750; color: var(--ink); }
.students { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; margin: 4px 0; }
.student { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.student .name { font-weight: 750; }
.student .r { font-size: 20px; font-weight: 650; white-space: nowrap; }

/* steps */
.step { margin-top: 24px; scroll-margin: 90px 0 130px; }
.path .step { margin-top: 18px; padding-left: 14px; border-left: 3px solid var(--line); }
.prompt { font-weight: 650; margin: 0 0 10px; }
.line { margin: 0 0 10px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.field { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; }
.prefix, .unit { font-weight: 650; white-space: nowrap; }
.ans { font-size: 22px; font-weight: 650; min-height: 52px; width: 6.5em; max-width: 100%; min-width: 0; padding: 8px 12px;
  border: 2px solid var(--muted); border-radius: 12px; background: var(--card); font-variant-numeric: tabular-nums; }
.ans.rule { width: 11em; }
.ans.small { width: 4.2em; text-align: center; }
.ans:focus { outline: 3px solid var(--ink); outline-offset: 1px; border-color: var(--ink); }
.ans:disabled { opacity: 1; border-style: dashed; background: transparent; }
.fields { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; }
.fieldbox { display: grid; gap: 4px; justify-items: center; }
.fieldbox .lab { font-size: 15px; font-weight: 650; color: var(--muted); }
.fieldbox.left { justify-items: start; }
.fieldbox.left figure, .fieldbox.left figcaption { text-align: left; }
.fieldbox.left figure svg { margin: 0; }
.gridtable { border-collapse: collapse; }
.gridtable th, .gridtable td { padding: 4px 3px; text-align: center; font-weight: 650; }
.gridtable th[scope="row"] { text-align: left; padding-right: 8px; }
.gridtable .ans.small { width: 50px; padding: 6px 2px; font-size: 20px; }
/* On narrow phones each rule sits above its own row of three boxes, so "S = 4 + 3(n − 1)" never crowds the boxes. */
@media (max-width: 419px) {
  .gridtable, .gridtable thead, .gridtable tbody { display: block; }
  .gridtable tr { display: grid; grid-template-columns: repeat(3, 62px); column-gap: 6px; }
  .gridtable thead th:first-child { display: none; }
  .gridtable th[scope="row"] { grid-column: 1 / -1; padding: 10px 0 2px; }
}
@media (min-width: 520px) { .gridtable th[scope="row"] { white-space: nowrap; } .gridtable .ans.small { width: 4em; } .gridtable td { padding: 4px 6px; } }
.okmark { width: 30px; height: 30px; flex: 0 0 auto; }
.btn { min-height: 48px; min-width: 48px; padding: 10px 20px; border-radius: 12px; border: 2px solid var(--ink);
  background: var(--ink); color: var(--paper); font-weight: 700; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .choice:focus-visible, .piece:focus-visible, .mark:focus-visible, .drop:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* feedback */
.fb { margin-top: 12px; }
.fb:empty { display: none; }
.note { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 2px dashed var(--line); }
.note[data-kind="correct"] { border: 2px solid var(--ink); }
.note[data-kind="format"] { border-style: solid; }
.note svg.icon { flex: 0 0 auto; width: 26px; height: 26px; margin-top: 1px; }
.note-body { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }   /* the text column takes the whole box */
.note-body p { margin: 0; }
.note-body p + p { margin-top: 6px; }
.test { font-variant-numeric: tabular-nums; font-weight: 650; }
.demo:empty, .path:empty { display: none; }
.demo { margin-top: 12px; }
.answer-card { padding: 12px 14px; border-radius: 14px; background: var(--soft); }
.answer-card .label { display: block; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.answer-card .val { display: block; font-size: 21px; font-weight: 750; overflow-wrap: anywhere; white-space: pre-line; }
.answer-card p { margin: 6px 0 0; }

/* choices and marks */
.choices { display: grid; gap: 10px; margin-bottom: 12px; }
.choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; min-height: 52px; padding: 12px 14px;
  border-radius: 12px; border: 2px solid var(--line); background: var(--card); cursor: pointer; line-height: 1.4; }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 650; }
.choice.is-answer { border-style: dashed; border-color: var(--ink); }
.choice:disabled { cursor: default; }
.choice .okmark { width: 26px; height: 26px; }
.mark-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mark-row .who { font-weight: 650; }
.mark-btns { display: flex; gap: 8px; }
.mark { min-height: 46px; min-width: 46px; padding: 8px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 650; cursor: pointer; }
.mark[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.mark.is-answer { outline: 2px dashed var(--ink); outline-offset: 2px; }

/* explain */
textarea.explain { display: block; width: 100%; min-height: 120px; font-size: 18px; padding: 10px 12px; border: 2px solid var(--muted); border-radius: 12px; background: var(--card); resize: vertical; }
textarea.explain:focus { outline: 3px solid var(--ink); outline-offset: 1px; }
.compare { display: grid; gap: 12px; margin-bottom: 10px; }
@media (min-width: 640px) { .compare.two { grid-template-columns: 1fr 1fr; } }
.model { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin: 0; font-weight: 600; }
label.tick { display: inline-flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; cursor: pointer; }
label.tick input { width: 26px; height: 26px; accent-color: var(--ink); margin: 0; }

/* Why? */
.why-wrap { margin-top: 26px; }
.why { margin-top: 12px; background: var(--soft); border-radius: 16px; padding: 14px 16px; }
.why p { margin: 0 0 10px; }
.why p:last-child { margin-bottom: 0; }
.why .card { margin: 8px 0 12px; }

/* tables */
.tablewrap { max-width: 100%; overflow-x: auto; }
table.t { border-collapse: collapse; margin: 6px 0 10px; font-size: 16px; font-variant-numeric: tabular-nums; }
.t th, .t td { border: 1px solid var(--line); padding: 6px 9px; text-align: center; min-width: 2.4em; background: var(--card); }
.t th[scope="row"] { text-align: left; font-weight: 650; background: var(--soft); min-width: 0; }
.t caption { caption-side: top; text-align: left; font-size: 14px; font-weight: 700; color: var(--muted); padding: 0 0 4px; }
.why .t th[scope="row"] { background: var(--card); }
.t tr.enter, .t td.filled { animation: rowIn .5s ease both; }
/* Round 3 polish, widths only: row labels never take more than two lines, Screen 3's value columns are all one width,
   and both tables still fit a 360 px phone. */
.comparetable td, .extable td { padding: 4px 3px; }
.comparetable td { width: 50px; }                  /* border-box: room for a 44 px input in every value column */
.extable td { min-width: 26px; }                  /* the two given columns match each other */
.comparetable th[scope="row"], .extable th[scope="row"] { min-width: 104px; }   /* "Skip count" fits on one line */
.comparetable .ans.small, .extable .ans.small { width: 44px; min-height: 44px; padding: 6px 2px; font-size: 19px; text-align: center; }   /* 44 px: the touch minimum, leaving margin at 360 px */
@keyframes rowIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* colour words and swatches */
.math { display: inline-block; white-space: nowrap; }   /* inline-block: WebKit measures it as one box when breaking lines */
.formula, .student .r, figcaption { white-space: nowrap; }
/* Nina's 4 (Q2): neutral, with "first square" hung underneath so the rule keeps its normal spacing. */
.first { position: relative; display: inline-block; margin-bottom: 15px; }
.first .fv { font-weight: 750; }
.first .fl { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); white-space: nowrap; line-height: 1.1;
  font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.c { color: var(--constant); font-weight: 750; }
.k { color: var(--coefficient); font-weight: 750; }
.sw { display: inline-block; width: .95em; height: .95em; border-radius: 3px; vertical-align: -.12em; margin: 0 .1em; }
.sw.c { background: var(--constant); }
.sw.k { background: var(--coefficient); }

/* figures */
.t-const { fill: var(--constant); }
.t-coef { fill: var(--coefficient); }
.g-const { fill: var(--constant); fill-opacity: .14; }
.g-coef { fill: var(--coefficient); fill-opacity: .14; }
.slot { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
line.slot { stroke-width: 2.5; stroke-linecap: round; }
.stick { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.stick.const { stroke: var(--constant); }
.stick.coef { stroke: var(--coefficient); }
.stick.dim { stroke: var(--stick-dim); }
.stick.lit { stroke: var(--lit); }
.stick.flash { animation: flash .45s ease-in-out 6 alternate; }
@keyframes flash { to { opacity: .1; } }
.hit { fill: transparent; cursor: pointer; outline: none; }
.hit:focus-visible { fill: var(--soft); stroke: var(--ink); stroke-width: 2; }
.armed .hit { fill: var(--ink); fill-opacity: .06; }
/* Round 7: tiles the learner taps to select (Screen 5). The figure is drawn at double size, so each tile is a 44 px target. */
.tap { cursor: pointer; outline: none; }
.tap:focus-visible { stroke: var(--muted); stroke-width: 2; }
.tap.is-answer { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 4 3; }
.tap[aria-pressed="true"] { stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: none; }
.flabel { font-size: 12px; font-weight: 600; fill: var(--muted); }
.counter { font-size: 40px; font-weight: 800; text-align: center; min-height: 1.3em; margin: 4px 0; font-variant-numeric: tabular-nums; }
.readout { text-align: center; font-weight: 650; font-size: 20px; margin: 8px 0 0; min-height: 1.5em; font-variant-numeric: tabular-nums; }

/* sliders */
input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 48px; margin: 6px 0 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; margin-top: -13px; border-radius: 50%; background: var(--ink); border: 3px solid var(--paper); box-shadow: 0 0 0 1px var(--ink); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); border: 3px solid var(--paper); }
input[type="range"]:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
input[type="range"]:disabled { opacity: .5; cursor: default; }

/* drag and tap */
.tray { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center; padding: 12px; margin-top: 12px;
  border: 2px dashed var(--line); border-radius: 16px; min-height: 80px; }
.tray .aside { font-weight: 650; }
.piece { touch-action: none; -webkit-user-select: none; user-select: none; background: var(--card); border: 2px solid var(--line);
  border-radius: 14px; padding: 8px 10px; min-width: 56px; min-height: 56px; cursor: grab; display: inline-flex; align-items: center; justify-content: center; }
.piece svg { display: block; pointer-events: none; }
.piece[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
.piece:disabled { opacity: .3; cursor: default; }
.ghost-piece { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 100; opacity: .92; margin: 0; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.drop { display: block; border-radius: 14px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }   /* the armed outline is the tap feedback */
.drop.armed { outline: 3px dashed var(--ink); outline-offset: 4px; cursor: pointer; }
.drop.over { outline: 3px solid var(--ink); outline-offset: 4px; }
.buildarea { min-height: 120px; display: flex; align-items: center; justify-content: center; }
.frozen .interactive { pointer-events: none; }

/* exit ticket and self-check */
.items { counter-reset: item; display: grid; gap: 22px; margin-top: 8px; }
.item .q { font-weight: 650; margin: 0 0 8px; }
.item .q .num { display: inline-block; min-width: 1.6em; padding-right: .3em; font-weight: 800; }   /* "2b." keeps a space before its question */
.item .fb { margin-top: 10px; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.checklist li { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.checklist li span { display: block; }
.checklist li span::first-letter { text-transform: uppercase; }
.checklist svg { flex: 0 0 auto; width: 28px; height: 28px; }

/* bottom navigation */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); }
.nav-inner { max-width: 760px; margin: 0 auto; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 12px; }
.nav .btn { min-width: 112px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner"><span class="brand" id="brand"></span><span id="where"></span></div>
  <div class="bar" aria-hidden="true"><span id="bar"></span></div>
</header>
<main id="lesson"></main>
<nav class="nav" aria-label="Lesson navigation">
  <div class="nav-inner">
    <button class="btn ghost" id="back" type="button"></button>
    <button class="btn" id="next" type="button"></button>
  </div>
</nav>
<script>
'use strict';

/* =====================================================================
   MODEL. Every count, border, speed and table value on screen comes from these functions.
   ===================================================================== */
const range = (a, b) => (b < a ? [] : Array.from({ length: b - a + 1 }, (_, i) => a + i));

// Tiles (Screens 2 to 6): 2 fixed tiles plus n groups of 3.
const TILES = { fixed: 2, group: 3 };
const tilesIn = (P, n) => P.fixed + P.group * n;
const tileCount = n => tilesIn(TILES, n);
// The skip count by 3 on its own (3n), and the figure the new Screen 3 asks about (HANDOFF-ROUND-6 3).
const skipCount = n => TILES.group * n;
const SKIP_AT = 5;
// The follow-up pattern after a second miss on 3B (Round-2-Wording D): 4 fixed tiles plus n groups of 2.
const TILES_FOLLOW = { fixed: 4, group: 2 };
// The practice patterns (HANDOFF-ROUND-7 7): 1 fixed tile plus groups of 5 (10P1), and 6 fixed tiles plus groups of 2 (10P2).
const TILES_P1 = { fixed: 1, group: 5 };
const TILES_P2 = { fixed: 6, group: 2 };
// The exit ticket's pattern (ROUND-2-AMENDMENT 3): 5 fixed tiles plus n groups of 4.
const TILES_EXIT = { fixed: 5, group: 4 };

// Sticks (Screens 7 to 10): a straight row of n squares, neighbours sharing an edge.
// Edges: uprights v0…vn, tops t0…, bottoms b0…, listed in counting order. Figure 0 is the lone stick v0.
function stickEdges(n) {
  const e = ['v0'];
  for (let i = 0; i < n; i++) e.push(`t${i}`, `b${i}`, `v${i + 1}`);
  return e;
}
const stickCount = n => stickEdges(n).length;
const stickSkip = n => (stickCount(1) - stickCount(0)) * n;   // the skip count by 3 for the sticks (round 7, Screen 9)
const sharedEdges = n => range(1, n - 1).map(i => `v${i}`);
function completeSquares(edges) {
  let k = 0;
  while ([`v${k}`, `t${k}`, `b${k}`, `v${k + 1}`].every(e => edges.includes(e))) k++;
  return k;
}
// Triangles (follow-up after a second miss on 7B): a row of n triangles of equal sticks, neighbours sharing a stick.
// Diagonals d0…dn and one horizontal h0…h(n−1) per triangle, in counting order.
function triangleEdges(n) {
  const e = n > 0 ? ['d0'] : [];
  for (let i = 0; i < n; i++) e.push(`h${i}`, `d${i + 1}`);
  return e;
}
const triangleSticks = n => triangleEdges(n).length;
// Building a student's rule (Screen 10): sticks before the groups fill the first square in this order;
// each group of 3 then adds a top, a bottom and a right side. constCls is the colour of those first sticks.
const CONST_ORDER = ['v0', 't0', 'b0', 'v1'];
function builtEdges(constant, groups, constCls = 'const') {
  const out = CONST_ORDER.slice(0, constant).map(e => ({ e, cls: constCls }));
  const start = constant >= CONST_ORDER.length ? 1 : 0;
  for (let i = 0; i < groups; i++) {
    const k = start + i;
    out.push({ e: `t${k}`, cls: 'coef' }, { e: `b${k}`, cls: 'coef' }, { e: `v${k + 1}`, cls: 'coef' });
  }
  return out;
}

/* =====================================================================
   LESSON DATA. All learner-facing content lives here; the engine below reads it.
   Quoted text comes word for word from the source of truth: docs/Seeing-the-Rule-Interactive-Lesson-Plan.md, with
   docs/Round-2-Decisions.md and docs/Round-2-Wording.md winning where they differ. Prompts the spec didn't give were
   approved in Round-2-Wording A.
   Tokens: {c|text} and {k|text} colour text as constant / coefficient; {sw:c} and {sw:k} are colour swatches.
   ===================================================================== */
// The completed skip-count table, read-only on the two screens after the table screen (HANDOFF-ROUND-6 1).
const DONE_TABLE = [['Figure n', n => n], ['Tiles', n => tileCount(n)], ['Skip count by\u00A03', skipCount], ['How many more', n => tileCount(n) - skipCount(n)]];
// 3S2: a wrong option and what it gives at Figure 5, computed from the rule. (parseRule and evalAt are hoisted; ruleFn isn't defined yet.)
const notSkip = expr => ({ text: expr, say: `${expr} gives ${fmt(evalAt(parseRule(expr), SKIP_AT))} at Figure ${SKIP_AT}, not ${fmt(skipCount(SKIP_AT))}.` });
// What a rule gives at a figure, for the practice screen's responses (the parser is hoisted, so this runs while LESSON is built).
const ruleAt = (expr, n) => fmt(evalAt(parseRule(expr), n));
// A practice pattern drawn as Figures 1 to 3, with a table of Figure n and Tiles beneath (HANDOFF-ROUND-7 7).
const practiceShow = P => [{ tiles: [1, 2, 3], pattern: P }, { compare: { cols: [1, 2, 3], rows: [['Figure n', n => n], ['Tiles', n => tilesIn(P, n)]] } }];

/* =====================================================================
   ANSWER CHECKING
   ===================================================================== */
const TEST_POINTS = [0, 1, 2, 3, 7, 1.5];

function normalize(raw) {
  return String(raw)
    .replace(/[−‒–—﹣－]/g, '-')
    .replace(/[×✕✖·•∙⋅]/g, '*')
    .replace(/÷/g, '/')
    .trim();
}

function tokenize(str) {
  const out = [];
  const re = /\s*(?:(\d+(?:[.,]\d+)?|[.,]\d+)|([nN])|([-+*/()^\u00B2]))/y;
  while (re.lastIndex < str.length) {
    const at = re.lastIndex;
    const m = re.exec(str);
    if (!m) { if (/^\s*$/.test(str.slice(at))) break; return null; }
    if (m[1]) out.push({ t: 'num', v: parseFloat(m[1].replace(',', '.')) });
    else if (m[2]) out.push({ t: 'n' });
    else out.push({ t: m[3] });
  }
  return out;
}

// Parses a rule in n: strips "T =", "S =", "P ="; accepts × and *, implicit multiplication (3n, 3(n − 1)), brackets, − and -.
function parseRule(raw) {
  const str = normalize(raw).replace(/^\s*[tspTSP]\s*(?:\(\s*n\s*\))?\s*=\s*/, '');
  const toks = tokenize(str);
  if (!toks || !toks.length) return null;
  let i = 0;
  const peek = () => toks[i];
  const isSign = p => p && (p.t === '+' || p.t === '-');
  function sum() {
    const terms = [];
    let sign = 1;
    if (isSign(peek())) { sign = peek().t === '-' ? -1 : 1; i++; }
    terms.push({ sign, node: prod() });
    while (isSign(peek())) { const sg = peek().t === '-' ? -1 : 1; i++; terms.push({ sign: sg, node: prod() }); }
    return { k: 'sum', terms };
  }
  function prod() {
    const fs = [{ op: '*', node: power() }];
    for (;;) {
      const p = peek();
      if (!p) break;
      if (p.t === '*' || p.t === '/') { i++; fs.push({ op: p.t, node: power() }); }
      else if (p.t === 'n' || p.t === '(') fs.push({ op: '*', node: power() });
      else break;
    }
    return fs.length === 1 ? fs[0].node : { k: 'prod', fs };
  }
  function power() {
    let b = atom();
    for (;;) {
      const p = peek();
      if (p && p.t === '^') { i++; b = { k: 'pow', b, e: atom() }; }
      else if (p && p.t === '\u00B2') { i++; b = { k: 'pow', b, e: { k: 'num', v: 2 } }; }
      else return b;
    }
  }
  function atom() {
    const p = toks[i++];
    if (!p) throw new Error('end');
    if (p.t === 'num') return { k: 'num', v: p.v };
    if (p.t === 'n') return { k: 'n' };
    if (p.t === '(') {
      const e = sum();
      if (!peek() || peek().t !== ')') throw new Error('bracket');
      i++;
      return { k: 'grp', e };
    }
    if (p.t === '-') return { k: 'neg', e: atom() };
    throw new Error('token');
  }
  try {
    const e = sum();
    if (i !== toks.length || !hasN(e)) return null;
    return e;
  } catch (err) { return null; }
}

function evalAt(node, n) {
  switch (node.k) {
    case 'num': return node.v;
    case 'n': return n;
    case 'grp': return evalAt(node.e, n);
    case 'neg': return -evalAt(node.e, n);
    case 'sum': return node.terms.reduce((a, t) => a + t.sign * evalAt(t.node, n), 0);
    case 'prod': return node.fs.reduce((a, f) => f.op === '*' ? a * evalAt(f.node, n) : a / evalAt(f.node, n), 1);
    case 'pow': return evalAt(node.b, n) ** evalAt(node.e, n);
  }
  return NaN;
}
function kids(node) {
  if (node.k === 'grp' || node.k === 'neg') return [node.e];
  if (node.k === 'sum') return node.terms.map(t => t.node);
  if (node.k === 'prod') return node.fs.map(f => f.node);
  if (node.k === 'pow') return [node.b, node.e];
  return [];
}
function some(node, test) { return test(node) || kids(node).some(c => some(c, test)); }
function hasN(node) { return some(node, x => x.k === 'n'); }   // a declaration, so parseRule can run while LESSON is built

// Straight-line rules only: no n times n, no n in a denominator, no power of n. Matching values at a few points
// proves a straight-line rule is the same, but not any other kind, so anything else is rejected before comparing.
function degree(node) {
  switch (node.k) {
    case 'num': return 0;
    case 'n': return 1;
    case 'grp': case 'neg': return degree(node.e);
    case 'sum': return Math.max(...node.terms.map(t => degree(t.node)));
    case 'prod': return node.fs.reduce((d, f) => d + (f.op === '/' ? (degree(f.node) > 0 ? Infinity : 0) : degree(f.node)), 0);
    case 'pow': return hasN(node.b) || hasN(node.e) ? Infinity : 0;
  }
  return Infinity;
}
const isLinear = e => degree(e) <= 1;
const close = (a, b) => Number.isFinite(a) && Number.isFinite(b) && Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(a), Math.abs(b));
// Equivalent: the same value at n = 0, 1, 2, 3, 7 and 1.5.
const sameRule = (a, b) => TEST_POINTS.every(x => close(evalAt(a, x), evalAt(b, x)));
const ruleFn = src => { const e = parseRule(src); return n => evalAt(e, n); };

// Numbers: "6.5" and "6.50" match; spaces and units after the number are ignored ("13 sticks").
function parseNumber(raw) {
  const str = normalize(raw).toLowerCase().replace(/\s+/g, ' ')
    .replace(/^[ntspdh] ?= ?/, '').replace(/^(?:figure|fig\.?|term) ?/, '');
  const m = str.match(/^([+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+))(?: ?[a-z²/%.' ]*)$/);
  return m ? parseFloat(m[1].replace(',', '.')) : null;
}
const near = (a, b) => Math.abs(a - b) < 1e-9;
const matches = (vals, answers) => vals.length === answers.length && vals.every((v, i) => near(v, answers[i]));

// Solves a linear rule for a target value.
function solveLinear(src, target) {
  const f = ruleFn(src), b = f(0), a = f(1) - b;
  return (target - b) / a;
}
// Formatting for anything computed: trims float noise, uses the minus sign.
function fmt(x) {
  const r = Math.round(x * 1e6) / 1e6;
  return String(Object.is(r, -0) ? 0 : r).replace('-', '−');
}

const JUDGE = {
  number(st, [raw]) {
    const v = parseNumber(raw);
    if (v === null) return { kind: 'format', say: LESSON.ui.numberFormat };
    if (near(v, st.answer())) return { kind: 'correct', say: st.say };
    for (const w of st.wrong || []) if (w.values.some(x => near(v, x))) return { kind: 'wrong', ...w };
    return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
  },
  rule(st, [raw]) {
    const e = parseRule(raw);
    if (!e) return { kind: 'format', say: LESSON.ui.ruleFormat };
    if (!isLinear(e)) return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
    const ans = parseRule(st.answer);
    const yours = n => evalAt(e, n), original = n => evalAt(ans, n);
    if (sameRule(e, ans)) return { kind: 'correct', say: st.say };
    for (const w of st.wrong || []) {
      if (sameRule(e, parseRule(w.rule))) return { kind: 'wrong', say: w.say, act: w.act, pre: w.pre ? w.pre(yours, original) : [] };
    }
    return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
  },
  numbers(st, raws, c) {
    const vals = raws.map(parseNumber);
    if (vals.some(v => v === null)) return { kind: 'format', say: LESSON.ui.numberFormat };
    if (st.judge) return st.judge(vals, st, c);
    if (matches(vals, st.answers())) return { kind: 'correct', say: st.say };
    // A wrong entry matches the whole answer (values), or any one box holding one of its numbers (any).
    for (const w of st.wrong || []) if (w.any ? vals.some(v => w.any.some(x => near(v, x))) : matches(vals, w.values)) return { kind: 'wrong', say: w.say };
    return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
  },
  tableRow(st, raws, c) { return JUDGE.numbers(st, raws, c); },
  choice(st, [i]) {
    const o = st.options[i];
    if (o.correct) return { kind: 'correct', say: o.say || st.say || null };
    if (o.say) return { kind: 'wrong', say: o.say };
    return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
  },
  // Tapped tiles (round 7): right when exactly the answer's tiles are selected, all of them; otherwise the first wrong entry
  // that matches, otherwise the hint. Check with nothing tapped also gets the hint (Marc, round 7).
  tapTiles(st, [s]) {
    const all = { fixed: TILES.fixed, group: TILES.group * st.figure };
    const other = st.answer === 'fixed' ? 'group' : 'fixed';
    if (s[st.answer] === all[st.answer] && s[other] === 0) return { kind: 'correct', say: st.say };
    for (const w of st.wrong || []) if (w.when(s)) return { kind: 'wrong', say: w.say };
    return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
  },
  marks(st, vals) {
    if (vals.every((v, i) => v === st.items[i].correct)) return { kind: 'correct', say: st.say || null };
    const w = st.items.find((it, i) => it.ifMarkedCorrect && vals[i] === true);
    if (w) return { kind: 'wrong', say: w.ifMarkedCorrect };
    return { kind: 'hint', say: st.hint || LESSON.ui.fallback };
  },
};

const SVGNS = 'http://www.w3.org/2000/svg';
// Every insertion goes through append/add, which skip null, undefined and false, so a missing value never shows as text.
function append(el, kids) {
  for (const k of [kids].flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
  return el;
}
const add = (el, ...kids) => append(el, kids);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }

      // The first and only submission, one result per numbered question: question 2 needs both 2 and 2b.
      const questions = [...new Set(st.items.map(it => it.question))];
      state.exit = questions.map(q => items.every((x, i) => x.it.question !== q || results[i].ok));
      c.done();
    });
    add(c.el, h('div', { class: 'items' }, items.map(x => x.el)), h('div', { class: 'row', style: 'margin-top: 20px' }, submit));
  },

  // Screen 16: one line per exit item, ticked only if that item was right on the exit ticket's one submission.
  selfcheck(st, c) {
    const ticked = it => !!(state.exit && state.exit[it.item - 1]);
    add(c.el, h('ul', { class: 'checklist' }, st.items.map(it => {
      const on = ticked(it);
      const ic = icon(on ? 'correct' : 'empty');
      ic.removeAttribute('aria-hidden');
      ic.setAttribute('role', 'img');
      ic.setAttribute('aria-label', on ? 'ticked' : 'not ticked');
      return h('li', { 'data-ticked': String(on) }, ic, h('span', {}, rich(it.text)));
    })));
    c.done();
  },
};

/* =====================================================================
   ENGINE
   ===================================================================== */
const state = { at: -1, view: -1, sections: [], log: [], booting: true };
const $ = id => document.getElementById(id);
const main = $('lesson');

// Runs steps one after another: each appears only when the one before it is done.
function runSteps(steps, ctx, container, onDone, isPath) {
  let k = 0;
  const next = (skip = 0) => {
    k += skip;
    if (k >= steps.length) { onDone(); return; }
    const st = steps[k];
    const last = !isPath && k === steps.length - 1;
    k += 1;
    const el = h('div', { class: 'step', 'data-step': `${st.of ?? ctx.sc.n}${st.id}` });   // of: a step moved from another screen keeps its ID
    add(container, el);
    const c = { ...ctx, el, last, done: next };
    (st.lines || []).forEach(t => add(el, h('p', { class: 'line' }, rich(t))));
    (st.show || []).forEach(b => add(el, block(b, c)));
    STEPS[st.type](st, c);
    if (!state.booting && !(k === 1 && !isPath)) requestAnimationFrame(() => el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'nearest' }));
  };
  next();
}

function renderScreen(i) {
  const sc = LESSON.screens[i];
  const log = state.log[i] = { secondMiss: false, done: false };
  const titleId = newId('t');
  const sec = h('section', { class: 'screen', 'data-screen': sc.key || sc.n, 'aria-labelledby': titleId });
  const panelId = newId('why');
  const whyBtn = h('button', { type: 'button', class: 'btn ghost why-btn', 'aria-expanded': 'false', 'aria-controls': panelId, hidden: true }, LESSON.ui.why);
  const whyPanel = h('div', { class: 'why', id: panelId, hidden: true });
  const setWhy = open => { whyPanel.hidden = !open; whyBtn.setAttribute('aria-expanded', String(open)); };
  whyBtn.addEventListener('click', () => setWhy(whyPanel.hidden));
  const ctx = {
    sc, sec, log, i, s: {},
    revealWhy: () => { if (sc.why) whyBtn.hidden = false; },
    hideWhy: () => { whyBtn.hidden = true; setWhy(false); },
    openWhy: () => { if (sc.why) { whyBtn.hidden = false; setWhy(true); } },
  };
  add(sec, h('p', { class: 'eyebrow' }, LESSON.parts[sc.part]), h('h1', { class: 'title', id: titleId, tabindex: '-1' }, sc.title));
  (sc.intro || []).forEach(t => add(sec, h('p', { class: 'intro' }, rich(t))));
  (sc.show || []).forEach(b => add(sec, block(b, ctx)));
  const steps = h('div', { class: 'steps' });
  append(whyPanel, (sc.why || []).map(b => block(b, ctx)));
  add(sec, steps, h('div', { class: 'why-wrap' }, whyBtn, whyPanel));
  add(main, sec);
  runSteps(sc.steps, ctx, steps, () => { log.done = true; chrome(); });
  return sec;
}

function freeze(sec) {
  unpick();
  sec.classList.add('frozen');
  sec.querySelectorAll('input, button, textarea').forEach(el => { if (!el.classList.contains('why-btn')) el.disabled = true; });
  sec.querySelectorAll('[tabindex]').forEach(el => { if (el.tagName !== 'H1') el.setAttribute('tabindex', '-1'); });
}

function show(i) {
  unpick();
  state.view = i;
  state.sections.forEach((el, j) => { el.hidden = j !== i; });
  chrome();
  window.scrollTo(0, 0);
  if (!state.booting) state.sections[i].querySelector('h1').focus({ preventScroll: true });
}

function forward() {
  if (state.view < state.at) { show(state.view + 1); return; }
  if (state.at >= 0 && !state.log[state.at].done) return;
  if (state.at === LESSON.screens.length - 1) return;
  if (state.at >= 0) freeze(state.sections[state.at]);
  state.at += 1;
  state.sections.push(renderScreen(state.at));
  show(state.at);
}

function chrome() {
  const total = LESSON.screens.length, i = state.view;
  $('where').textContent = LESSON.ui.progress(i + 1, total);
  $('bar').style.width = `${((i + 1) / total) * 100}%`;
  $('back').disabled = i <= 0;
  $('next').disabled = !(i < state.at || (state.log[i] && state.log[i].done && i < total - 1));
  $('next').hidden = i === total - 1;
}

$('brand').textContent = LESSON.title;
$('back').textContent = LESSON.ui.back;
$('next').textContent = LESSON.ui.next;
$('back').addEventListener('click', () => { if (state.view > 0) show(state.view - 1); });
$('next').addEventListener('click', forward);
forward();
state.booting = false;
</script>
</body>
</html>
